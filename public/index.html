<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinterSnow - E-commerce Platform</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <h1>❄️ WinterSnow</h1>
                </div>
                <div class="nav-menu">
                    <a href="/" class="nav-link active">Products</a>
                    <a href="/cart.html" class="nav-link">
                        Cart <span id="cart-count" class="badge">0</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h2>Welcome to WinterSnow</h2>
                <p>Your one-stop shop for winter essentials</p>
            </div>
        </section>

        <section class="products">
            <div class="container">
                <h2>Our Products</h2>
                <div id="products-grid" class="products-grid">
                    <!-- Products will be loaded here dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 WinterSnow E-commerce Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
